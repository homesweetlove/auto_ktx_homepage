services:
  ktx-sniper:
    build: .
    container_name: ktx-sniper
    restart: unless-stopped
    ports:
      # 호스트의 로컬 주소에만 노출. 외부 공개가 필요하면 리버스 프록시(HTTPS) 뒤에 두세요.
      - "127.0.0.1:3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN을 .env에 설정하세요}
      - KORAIL_ID=${KORAIL_ID:-}
      - KORAIL_PASSWORD=${KORAIL_PASSWORD:-}
